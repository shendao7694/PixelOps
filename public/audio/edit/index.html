<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 地图编辑器</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="viewport">
  <canvas id="canvas3d"></canvas>
  <div id="info-overlay">
    <span id="objectCount">对象: 0</span>
  </div>
</div>

<div id="panel">
  <h3>工具</h3>
  <div class="tools" id="tools">
    <button data-tool="select" class="active">选择</button>
    <button data-tool="box">箱子</button>
    <button data-tool="slab">板</button>
    <button data-tool="wall">墙</button>
    <button data-tool="stairs">楼梯</button>
    <button data-tool="sandbag">沙袋</button>
    <button data-tool="crate">货箱</button>
    <button data-tool="barrel">桶</button>
  </div>

  <h3>变换</h3>
  <div class="tools" id="modes">
    <button data-mode="translate" class="mode-active">移动</button>
    <button data-mode="scale">缩放</button>
    <button data-mode="rotate">旋转</button>
  </div>

  <h3>属性</h3>
  <div id="props">
    <div class="prop-row">
      <label>X</label>
      <input id="px" type="number" step="0.5" value="0">
      <label>Y</label>
      <input id="py" type="number" step="0.5" value="0">
      <label>Z</label>
      <input id="pz" type="number" step="0.5" value="0">
    </div>
    <div class="prop-row">
      <label>宽</label>
      <input id="pw" type="number" step="0.5" value="2">
      <label>深</label>
      <input id="pd" type="number" step="0.5" value="2">
      <label>高</label>
      <input id="ph" type="number" step="0.5" value="2">
    </div>
    <div class="prop-row">
      <label>轴</label>
      <select id="axis">
        <option value="x">X</option>
        <option value="z">Z</option>
      </select>
      <label>旋转</label>
      <input id="rotation" type="number" step="5" value="0">
    </div>
    <div class="prop-row">
      <label>材质</label>
      <select id="pmat">
        <option value="concrete">混凝土</option>
        <option value="concreteDark">深混凝土</option>
        <option value="metal">金属</option>
        <option value="metalDark">深金属</option>
        <option value="brick">砖</option>
        <option value="crate">货箱</option>
        <option value="wood">木头</option>
        <option value="glass">玻璃</option>
        <option value="roof">屋顶</option>
        <option value="hazard">危险</option>
        <option value="containerRust">锈集装箱</option>
        <option value="containerGreen">绿集装箱</option>
        <option value="containerBlue">蓝集装箱</option>
        <option value="tile">瓷砖</option>
      </select>
    </div>
  </div>

  <div class="btn-row">
    <button id="deleteSelected" class="btn-danger" disabled>删除选中</button>
    <button id="clearAll" class="btn-warning">清空全部</button>
  </div>

  <div class="btn-row">
    <button id="importBtn" class="btn-import">导入 JSON</button>
    <button id="exportBtn" class="btn-export">导出 JSON</button>
  </div>
  <textarea id="output" spellcheck="false"></textarea>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./editor.js"></script>
</body>
</html>
