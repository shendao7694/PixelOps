<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512"
  role="img" aria-labelledby="title desc" data-weapon="arc-7-railgun"
  data-action="charged-rail-cannon" data-model-source="buildRailgun">
  <title id="title">ARC-7 electromagnetic rail cannon side silhouette</title>
  <desc id="desc">Side projection matched to the in-game buildRailgun geometry: one overlapping twin-rail profile, five narrow coil collars, box thermal optic, compact battery, angled foregrip, pistol grip and short box stock.</desc>
  <g fill="#dce7ea">
    <!-- The physical rails sit side by side on X in the game model. From this
         true side view they overlap into one long accelerator profile. -->
    <path d="M52 245h78v38H52l-17-19 17-19Z"/>
    <path d="M118 253h496v20H118z"/>
    <path d="M153 219h519v25H153z"/>

    <!-- Five narrow accelerator collars use the same spacing and proportions
         as buildRailgun(); they bridge the top spine to the rail body. -->
    <path d="M180 242h19v43h-19zM269 242h19v43h-19zM357 242h19v43h-19zM446 242h19v43h-19zM534 242h19v43h-19z"/>

    <!-- Square receiver and the shallow capacitor banks on both sides. -->
    <path d="M525 241h295v62H525z"/>
    <path d="M554 257h189v39H554z"/>

    <!-- Long square thermal optic, its two feet, end hoods and adjustment
         turrets. These are deliberately box-shaped like the in-game sight. -->
    <path d="M478 176h212v32H478z"/>
    <path d="M466 172h41v40h-41zM678 172h41v40h-41z"/>
    <path d="M516 208h20v33h-20zM646 208h20v33h-20z"/>
    <path d="M571 161h16v15h-16zM600 176h16v15h-16z"/>

    <!-- Compact detachable power cell and locking shoe. -->
    <path d="M656 296h57v69h-57z"/>
    <path d="M654 365h61v10h-61z"/>

    <!-- Angled support grip and its short rail mount. -->
    <path d="M445 274h36v18h-36z"/>
    <path d="M442 286 468 278 501 342 475 353Z"/>

    <!-- Trigger grip follows the actual 0.28-radian rake instead of the large
         invented magazine well used by the discarded draft. -->
    <path d="M717 260 748 257 771 340 738 344Z"/>
    <path d="M700 280h45v8h-45z"/>

    <!-- Short box stock, cheek rest, full-height butt pad and charge spine. -->
    <path d="M749 242h204v62H749z"/>
    <path d="M788 222h144v24H788z"/>
    <path d="M953 241h17v70h-17z"/>
    <path d="M773 255h94v8h-94z"/>
  </g>
</svg>
