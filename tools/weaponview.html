<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>weapon viewer - dev harness</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#20262c}canvas{display:block}</style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js" } }
</script>
<script type="module">
// Development harness: renders one code-built weapon with its first-person
// arms on a neutral stage, so model work can be reviewed from any angle
// without driving a whole match. ?w=rifle&cam=x,y,z&at=x,y,z
import * as THREE from 'three';
import { buildTextures } from '../src/world/textures.js';
import { buildWeapon, buildViewArms } from '../src/game/weapons.js';
import {
  sidearmReloadComponentPose,
  updateSidearmReloadComponent,
} from '../src/game/sidearm-reload.js';

const params = new URLSearchParams(location.search);
const id = params.get('w') || 'rifle';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3138);
scene.add(new THREE.HemisphereLight(0xcfd8e0, 0x3a4048, 1.5));
const key = new THREE.DirectionalLight(0xfff0d8, 2.0);
key.position.set(-2.5, 3.5, 2.0);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6f8fb8, 0.8);
rim.position.set(2.0, -1.0, -2.5);
scene.add(rim);
scene.add(new THREE.GridHelper(2, 20, 0x46505a, 0x343c44));

const textures = buildTextures();
const { group, anchors } = buildWeapon(id, textures, true);
scene.add(group);
if (params.get('arms') !== '0') {
  const { armR, armL } = buildViewArms(textures, 'blue');
  armR.position.copy(anchors.grip);
  group.add(armR);
  armL.position.copy(anchors.foregrip);
  group.add(armL);
  // ?reload=0.4 freezes the reload partway through: the magazine component
  // takes its exchange pose and the support hand rides along with it.
  const reloadAt = params.get('reload');
  if (reloadAt !== null) {
    const u = Number(reloadAt);
    updateSidearmReloadComponent(group, id, u);
    const pose = sidearmReloadComponentPose(id, u);
    const mg = anchors.magazineGrip || anchors.foregrip;
    const handGrab = Math.sin(Math.min(1, Math.max(0, u)) * Math.PI);
    armL.position.set(
      anchors.foregrip.x + (mg.x - anchors.foregrip.x) * handGrab + pose.offsetX,
      anchors.foregrip.y + (mg.y - anchors.foregrip.y) * handGrab + pose.offsetY,
      anchors.foregrip.z + (mg.z - anchors.foregrip.z) * handGrab + pose.offsetZ
    );
  }
}

const cam = (params.get('cam') || '-0.9,0.45,0.45').split(',').map(Number);
const at = (params.get('at') || '0,0.02,-0.15').split(',').map(Number);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 50);
camera.position.set(...cam);
camera.lookAt(...at);
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
